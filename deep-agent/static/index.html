<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deep Agent 调试台</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1b1f24;
    --muted: #6b7280;
    --accent: #2f6fed;
    --accent-soft: #eaf0fe;
    --ok: #157f4a;
    --warn: #a15c00;
    --err: #b3261e;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .pill {
    font-size: 12px; padding: 2px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid #d3e0fb; white-space: nowrap;
  }
  .pill.gray { background: #f1f2f4; color: var(--muted); border-color: var(--border); }
  .spacer { flex: 1; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel);
    padding: 5px 12px; color: var(--text);
  }
  button:hover { background: #f2f4f7; }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.06); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .layout { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 232px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); padding: 14px; overflow-y: auto;
  }
  aside h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .7px;
    color: var(--muted); margin: 0 0 10px;
  }
  .subagent {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 9px 11px; margin-bottom: 8px; background: #fcfcfd;
  }
  .subagent b { display: block; font-size: 13px; margin-bottom: 2px; }
  .subagent span { font-size: 11.5px; color: var(--muted); }

  main { flex: 1; overflow-y: auto; padding: 18px 22px; min-width: 0; }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
  .empty code {
    font-family: var(--mono); background: var(--panel); padding: 2px 6px;
    border-radius: 5px; border: 1px solid var(--border);
  }

  .turn { margin-bottom: 18px; }
  .who {
    font-size: 11.5px; font-weight: 650; color: var(--muted);
    text-transform: uppercase; letter-spacing: .6px; margin-bottom: 5px;
  }
  .bubble {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 14px; white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.user { background: var(--accent); border-color: var(--accent); color: #fff; }

  .block { margin: 8px 0; }
  .card {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--panel); overflow: hidden;
  }
  .card > summary {
    cursor: pointer; padding: 8px 12px; display: flex; align-items: center;
    gap: 9px; font-size: 13px; list-style: none; user-select: none;
  }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary:hover { background: #fafbfc; }
  .card .body {
    border-top: 1px solid var(--border); padding: 10px 12px;
    font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
    word-break: break-word; color: #31363c; background: #fbfcfd;
    max-height: 340px; overflow: auto;
  }
  .tag {
    font-size: 10.5px; font-weight: 700; letter-spacing: .5px;
    padding: 1px 7px; border-radius: 5px; text-transform: uppercase;
  }
  .tag.tool { background: #eef1f5; color: #47505a; }
  .tag.sub  { background: #ede8fd; color: #5b3fd1; }
  .tag.agent{ background: var(--accent-soft); color: var(--accent); }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 11.5px; margin-left: auto; font-family: var(--mono); }

  .sub-block {
    border-left: 3px solid #a58cf0; margin: 8px 0 8px 10px;
    padding-left: 12px; background: #fbfaff; border-radius: 0 8px 8px 0;
    padding-top: 8px; padding-bottom: 8px; padding-right: 10px;
  }
  .sub-block .sub-title {
    font-size: 12.5px; font-weight: 650; color: #5b3fd1; margin-bottom: 6px;
  }
  .sub-block .sub-desc { font-size: 12px; color: var(--muted); margin-bottom: 6px; }

  .todos { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  .todos li { display: flex; gap: 8px; padding: 2px 0; }
  .todos .st { font-family: var(--mono); font-size: 11px; width: 74px; flex-shrink: 0; }
  .st.completed { color: var(--ok); }
  .st.in_progress { color: var(--warn); }
  .st.pending { color: var(--muted); }

  .err { color: var(--err); border-color: #f2c9c5; background: #fdf3f2; }
  .cursor::after {
    content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    background: var(--panel); border-top: 1px solid var(--border); padding: 12px 18px;
  }
  .composer { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--radius);
    min-height: 46px; max-height: 180px; background: #fff; color: var(--text);
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>

<header>
  <h1>Deep Agent 调试台</h1>
  <span class="pill" id="model-pill">加载中…</span>
  <span class="pill gray" id="thread-pill">thread: -</span>
  <span class="spacer"></span>
  <button id="reset-btn">新会话</button>
</header>

<div class="layout">
  <aside>
    <h2>可调度子 Agent</h2>
    <div id="subagent-list"></div>
  </aside>

  <main id="timeline">
    <div class="empty">
      <p>发一条消息试试，比如：</p>
      <p><code>帮我调研一下 SSE 和 WebSocket 的取舍，然后给一个选型建议</code></p>
    </div>
  </main>
</div>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="输入任务… (Enter 发送，Shift+Enter 换行)"></textarea>
    <button class="primary" id="send-btn">发送</button>
  </div>
  <div class="hint">事件流：run_start → token / tool_start / subagent_start … → run_end</div>
</footer>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const timeline = $("timeline");
  const input = $("input");
  const sendBtn = $("send-btn");
  const modelPill = $("model-pill");
  const threadPill = $("thread-pill");

  let threadId = null;
  let es = null;          // 当前 EventSource
  let streaming = false;
  let textBlock = null;   // 当前正在追加 token 的气泡
  let currentSub = null;  // 当前子 agent 的容器

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function clearEmpty() {
    const e = timeline.querySelector(".empty");
    if (e) e.remove();
  }

  function scrollDown() { timeline.scrollTop = timeline.scrollHeight; }

  function addTurn(role, text) {
    clearEmpty();
    const turn = document.createElement("div");
    turn.className = "turn";
    turn.innerHTML = `<div class="who">${role === "user" ? "你" : "agent"}</div>`;
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (role === "user" ? " user" : "");
    bubble.textContent = text;
    turn.appendChild(bubble);
    timeline.appendChild(turn);
    scrollDown();
    return bubble;
  }

  // 一个新的「文本气泡」，后续 token 都追加到这里
  function newTextBlock(agent) {
    clearEmpty();
    const wrap = document.createElement("div");
    wrap.className = "block";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = agent === "main" ? "主 agent" : `子 agent · ${agent}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble cursor";
    wrap.appendChild(who);
    wrap.appendChild(bubble);
    (currentSub || timeline).appendChild(wrap);
    textBlock = bubble;
    scrollDown();
    return bubble;
  }

  function appendToken(text, agent) {
    if (!textBlock || textBlock.dataset.agent !== agent) {
      newTextBlock(agent);
      textBlock.dataset.agent = agent;
    }
    textBlock.textContent += text;
    scrollDown();
  }

  function endTextBlock() {
    if (textBlock) { textBlock.classList.remove("cursor"); textBlock = null; }
  }

  function card(kind, name, bodyText, metaText, open) {
    const wrap = document.createElement("div");
    wrap.className = "block";
    const d = document.createElement("details");
    d.className = "card";
    if (open) d.open = true;
    d.innerHTML =
      `<summary><span class="tag ${kind}">${kind === "sub" ? "SUBAGENT" : "TOOL"}</span>` +
      `<span class="name">${esc(name)}</span>` +
      (metaText ? `<span class="meta">${esc(metaText)}</span>` : "") +
      `</summary>`;
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = bodyText || "(空)";
    d.appendChild(body);
    wrap.appendChild(d);
    (currentSub || timeline).appendChild(wrap);
    scrollDown();
    return { wrap, body };
  }

  // ---------------------------------------------------------------- 事件处理
  const handlers = {
    run_start(d) {
      threadId = d.thread_id;
      threadPill.textContent = "thread: " + threadId.slice(0, 8);
      threadPill.title = threadId;
    },

    token(d) { appendToken(d.text, d.agent || "main"); },

    message() { /* 完整消息，调试台用 token 就够了 */ },

    tool_start(d) {
      endTextBlock();
      const args = typeof d.args === "string" ? d.args : JSON.stringify(d.args, null, 2);
      card("tool", d.name, args, d.agent === "main" ? "" : d.agent);
    },

    tool_end(d) {
      endTextBlock();
      const cards = timeline.querySelectorAll("details.card");
      const last = cards[cards.length - 1];
      if (last && last.querySelector(".tag.tool")) {
        last.querySelector(".body").textContent = d.output || "(空)";
      } else {
        card("tool", d.name + " → 结果", d.output);
      }
    },

    subagent_start(d) {
      endTextBlock();
      const box = document.createElement("div");
      box.className = "sub-block";
      box.dataset.sub = d.name;
      box.innerHTML =
        `<div class="sub-title">↳ 派发给子 agent：${esc(d.name)}</div>` +
        (d.description ? `<div class="sub-desc">${esc(d.description)}</div>` : "");
      timeline.appendChild(box);
      currentSub = box;
      scrollDown();
    },

    subagent_end(d) {
      endTextBlock();
      if (currentSub) {
        const res = document.createElement("details");
        res.className = "card";
        res.innerHTML = `<summary><span class="tag sub">RESULT</span>` +
          `<span class="name">${esc(d.name)} 返回</span></summary>`;
        const body = document.createElement("div");
        body.className = "body";
        body.textContent = d.output || "(空)";
        res.appendChild(body);
        currentSub.appendChild(res);
      }
      currentSub = null;
      scrollDown();
    },

    todo(d) {
      endTextBlock();
      const todos = Array.isArray(d.todos) ? d.todos : [];
      if (!todos.length) return;
      const wrap = document.createElement("div");
      wrap.className = "block";
      const items = todos.map((t) => {
        const st = t.status || "pending";
        return `<li><span class="st ${esc(st)}">${esc(st)}</span>` +
               `<span>${esc(t.content || "")}</span></li>`;
      }).join("");
      wrap.innerHTML = `<div class="card"><summary>` +
        `<span class="tag agent">PLAN</span><span class="name">待办清单</span>` +
        `<span class="meta">${todos.length} 项</span></summary>` +
        `<div class="body"><ul class="todos">${items}</ul></div></div>`;
      wrap.querySelector("details").open = true;
      (currentSub || timeline).appendChild(wrap);
      scrollDown();
    },

    error(d) {
      endTextBlock();
      const wrap = document.createElement("div");
      wrap.className = "block";
      wrap.innerHTML = `<div class="bubble err">⚠ ${esc(d.message)}</div>`;
      (currentSub || timeline).appendChild(wrap);
      scrollDown();
    },

    run_end() { finish(); },
  };

  function finish() {
    endTextBlock();
    streaming = false;
    currentSub = null;
    sendBtn.disabled = false;
    input.disabled = false;
    if (es) { es.close(); es = null; }
    input.focus();
  }

  // ---------------------------------------------------------------- 发送
  function send() {
    const message = input.value.trim();
    if (!message || streaming) return;

    streaming = true;
    sendBtn.disabled = true;
    input.value = "";
    input.style.height = "auto";
    addTurn("user", message);

    const params = new URLSearchParams({ message });
    if (threadId) params.set("thread_id", threadId);

    es = new EventSource("/api/chat/stream?" + params.toString());
    Object.entries(handlers).forEach(([name, fn]) => {
      es.addEventListener(name, (e) => {
        let data = {};
        try { data = JSON.parse(e.data); } catch (_) {}
        fn(data);
      });
    });
    es.onerror = () => {
      if (!streaming) return;
      endTextBlock();
      const wrap = document.createElement("div");
      wrap.className = "block";
      wrap.innerHTML = `<div class="bubble err">连接中断：请确认后端已启动且模型已配置</div>`;
      timeline.appendChild(wrap);
      finish();
    };
  }

  // ---------------------------------------------------------------- 初始化
  async function boot() {
    try {
      const h = await (await fetch("/api/health")).json();
      modelPill.textContent = `${h.provider} · ${h.model}`;
    } catch (_) {
      modelPill.textContent = "后端未连接";
    }
    try {
      const a = await (await fetch("/api/agents")).json();
      const box = $("subagent-list");
      box.innerHTML = (a.subagents || []).map((s) =>
        `<div class="subagent"><b>${esc(s.display_name || s.name)}</b>` +
        `<span>${esc(s.name)}</span><br>` +
        `<span>${esc((s.description || "").slice(0, 90))}…</span></div>`
      ).join("") || `<div class="subagent"><span>未注册子 agent</span></div>`;
    } catch (_) { /* 忽略 */ }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  });
  $("reset-btn").addEventListener("click", async () => {
    if (threadId) {
      try { await fetch("/api/threads/" + threadId, { method: "DELETE" }); } catch (_) {}
    }
    threadId = null;
    threadPill.textContent = "thread: -";
    timeline.innerHTML = `<div class="empty"><p>已开启新会话。</p></div>`;
    input.focus();
  });

  boot();
  input.focus();
})();
</script>
</body>
</html>
